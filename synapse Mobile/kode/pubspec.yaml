name: synapse_mobile
description: "Synapse Mobile"
publish_to: 'none'
version: 1.2.1+2201

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Routing (padanan react-router)
  go_router: ^14.6.2
  # State (padanan nanostores)
  flutter_riverpod: ^2.6.1
  # Transport (padanan WebSocket /events desktop)
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  # Simpan kredensial (JANGAN plaintext)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # Markdown (padanan streamdown + shiki)
  flutter_markdown: ^0.7.4
  # Ikon SAMA dengan desktop (Tabler)
  tabler_icons: ^0.0.1
  # i18n
  intl: ^0.20.3

  # ===== SPECIAL CHAT (fitur Open-LLM-VTuber) =====
  flutter_tts: ^4.2.0            # TTS bawaan HP (cadangan)
  audioplayers: ^6.1.0           # putar suara anime (edge-tts)
  path_provider: ^2.1.5          # path file sementara
  package_info_plus: ^8.1.2      # baca versi APK
  speech_to_text: ^7.0.0         # ASR: user bicara
  permission_handler: ^11.3.1    # izin mikrofon/kamera
  webview_flutter: ^4.10.0       # Live2D avatar

  image_picker: ^1.1.2
  file_picker: ^10.3.10
  # Buka file APK hasil unduhan -> munculkan installer Android
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/backgrounds/
    # PENTING: Flutter TIDAK rekursif -> subfolder harus eksplisit
    - assets/live2d/
    - assets/live2d/Haru/
    - assets/live2d/Haru/Haru.2048/
    - assets/live2d/Haru/expressions/
    - assets/live2d/Haru/motions/
    - assets/live2d/Hiyori/
    - assets/live2d/Hiyori/Hiyori.2048/
    - assets/live2d/Hiyori/motions/
    - assets/live2d/Mao/
    - assets/live2d/Mao/Mao.2048/
    - assets/live2d/Mao/expressions/
    - assets/live2d/Mao/motions/
    - assets/live2d/Mark/
    - assets/live2d/Mark/Mark.2048/
    - assets/live2d/Mark/motions/
    - assets/live2d/Natori/
    - assets/live2d/Natori/Natori.2048/
    - assets/live2d/Natori/exp/
    - assets/live2d/Natori/motions/
    - assets/live2d/Ren/
    - assets/live2d/Ren/Ren.2048/
    - assets/live2d/Ren/expressions/
    - assets/live2d/Ren/motions/
    - assets/live2d/Rice/
    - assets/live2d/Rice/Rice.2048/
    - assets/live2d/Rice/motions/
    - assets/live2d/Wanko/
    - assets/live2d/Wanko/Wanko.1024/
    - assets/live2d/Wanko/motions/
