<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0D0C11}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  #peta{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
  #pesan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#DCB363;font:12px/1.6 monospace;text-align:center;padding:20px;white-space:pre-wrap;z-index:2}
</style>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
</head>
<body>
<img id="bg" alt="">
<canvas id="peta"></canvas>
<div id="pesan">Memuat...</div>
<script>
var app = null, model = null;
var AKAR = '/live2d/';
var LOG = [];
var LW = 0, LH = 0;

function kabar(t){
  LOG.push(t);
  var e = document.getElementById('pesan');
  if(e){ e.style.display='flex'; e.textContent = LOG.join('\n'); }
}
function sembunyi(){
  var e = document.getElementById('pesan');
  if(e) e.style.display='none';
}

function mulai(){
  try{
    if(!window.PIXI || !PIXI.live2d || !window.Live2DCubismCore){
      kabar('X pustaka belum siap'); return;
    }
    try{ PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); }catch(e){}

    var cv = document.getElementById('peta');
    LW = Math.max(1, cv.clientWidth);
    LH = Math.max(1, cv.clientHeight);

    app = new PIXI.Application({
      view: cv,
      width: LW,
      height: LH,
      backgroundAlpha: 0,
      antialias: false,   // WAJIB false: kalau true, clipping mask Live2D rusak
      // JEBAKAN #87 (v1.2.4) — AKAR "BURIK/BURAM":
      // Canvas dirender 1x (backing store = CSS px) lalu di-UPSCALE ke layar
      // fisik 1220x2712 -> karakter kabur (padahal background <img> tajam).
      // Paksa 3x TANPA bergantung devicePixelRatio WebView (bisa 1).
      // autoDensity:true -> ukuran TAMPIL tetap, hanya resolusi internal naik.
      resolution: 3,
      autoDensity: true
    });
    muatModel('Hiyori');
    // JEBAKAN #88 (v1.2.4): JANGAN polling resize tiap 300ms — berkelahi
    // dengan autoDensity -> ukuran bolak-balik (besar<->normal). Cukup
    // andalkan event 'resize' (sudah terpasang di bawah).

    // ===== PENGAWAS PERFORMA (v1.2.6) — HP berat agar tidak ngeframe =====
    // PRIORITAS MUTLAK: KUALITAS HD TIDAK BOLEH TURUN.
    // Urutan penanganan saat lambat:
    //   1) batasi FPS (60 -> 30)  -> kualitas SAMA, beban GPU separuh
    //   2) baru turunkan resolusi (3 -> 2) HANYA kalau masih lambat
    mulaiPengawas();
  }catch(e){ kabar('X mulai: ' + e.message); }
}

// Ukur waktu render; kalau lambat, kurangi beban TANPA menurunkan kualitas
// (turunkan FPS dulu). Kalau masih lambat, baru resolusi diturunkan bertahap.
function mulaiPengawas(){
  var n = 0, total = 0, sudahBatasi = false, sudahTurun = false;
  var t0 = 0;
  var ticker = PIXI.Ticker.shared;
  var lamaTick = ticker.add(function(){
    var now = performance.now();
    if(t0){ total += (now - t0); n++; }
    t0 = now;
    if(n < 90) return;
    var rata = total / n;          // ms per frame
    n = 0; total = 0;
    if(rata > 26 && !sudahBatasi){
      // lambat -> batasi 30 FPS (kualitas TETAP SAMA)
      sudahBatasi = true;
      try{ app.ticker.maxFPS = 30; }catch(e){}
    } else if(rata > 33 && !sudahTurun){
      // masih sangat lambat -> turunkan resolusi bertahap (3 -> 2)
      sudahTurun = true;
      try{ app.renderer.resolution = 2; app.renderer.resize(LW, LH); aturModel(); }catch(e){}
    }
  });
  ticker.start();
  window._lamaTick = lamaTick;
}

// PENTING: canvas selalu MENGIKUTI wadah (bukan di-stretch),
// dan model di-skala ulang agar SELALU muat penuh (tidak terpotong,
// tidak super besar) walau wadah mengecil karena keyboard. JEBAKAN #66.
function cekUkuran(){
  try{
    if(!app || !model) return;
    var cv = document.getElementById('peta');
    var w = Math.max(1, cv.clientWidth);
    var h = Math.max(1, cv.clientHeight);
    var r = app.renderer;
    if(r.width !== w || r.height !== h){ r.resize(w, h); aturModel(); }
    LW = w; LH = h;
  }catch(e){}
}

function muatModel(nama){
  try{
    if(model){
      try{ app.stage.removeChild(model); }catch(e){}
      try{ model.destroy(); }catch(e){}
      model = null;
    }
    var url = AKAR + nama + '/' + nama + '.model3.json';
    PIXI.live2d.Live2DModel.from(url, { autoInteract: false }).then(function(m){
      model = m;
      app.stage.addChild(model);
      aturModel();
      try{ model.motion('Idle'); }catch(e){}
      sembunyi();
    }).catch(function(e){
      kabar('X muat ' + nama + ': ' + (e && e.message ? e.message : e));
    });
  }catch(e){ kabar('X muatModel: ' + e.message); }
}

// Karakter selalu MUAT penuh di wadah (kepala sampai kaki terlihat).
function aturModel(){
  if(!model || !app) return;
  // JEBAKAN #88: pakai LW/LH (CSS px yang kita lacak) — JANGAN app.screen,
  // karena dengan resolution>1 + autoDensity nilainya bisa tak stabil
  // sehingga skala model melonjak (hanya kaki yang terlihat).
  var W = LW, H = LH;
  var mw = model.width, mh = model.height;
  if(!mw || !mh || W < 2 || H < 2) return;
  var skala = Math.min(W / mw, (H * 0.92) / mh);
  model.scale.set(skala);
  model.anchor.set(0.5, 1);
  model.x = W * 0.5;
  model.y = H * 0.99;
}

window.gantiModel = function(n){ muatModel(n); };

window.gantiBackground = function(nama){
  var bg = document.getElementById('bg');
  if(!bg) return;
  if(!nama || nama === 'none'){ bg.style.display='none'; return; }
  bg.style.display = 'block';
  bg.src = '/backgrounds/' + encodeURIComponent(nama);
};

window.setBicara = function(v){
  if(!model) return;
  var on = (v === 'true' || v === true);
  var core = model.internalModel.coreModel;
  if(on){
    if(window._m) clearInterval(window._m);
    window._m = setInterval(function(){
      try{ core.setParameterValueById('ParamMouthOpenY', 0.3 + Math.random()*0.7); }catch(e){}
    }, 90);
  }else{
    if(window._m) clearInterval(window._m);
    try{ core.setParameterValueById('ParamMouthOpenY', 0); }catch(e){}
  }
};

window.setEmosi = function(e){ if(model){ try{ model.expression(e); }catch(x){} } };

window.addEventListener('resize', cekUkuran);

window.addEventListener('load', function(){
  var n = 0;
  var t = setInterval(function(){
    n++;
    if(window.PIXI && PIXI.live2d && window.Live2DCubismCore){
      clearInterval(t); mulai();
    }else if(n > 80){
      clearInterval(t); kabar('X pustaka gagal dimuat (butuh internet)');
    }
  }, 250);
});
</script>
</body>
</html>
